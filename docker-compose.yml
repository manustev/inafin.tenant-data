# Local dev stack for the tenant data layer.
#
# The runtime NEVER connects to postgres:5432 directly — only through pgbouncer:6432
# in transaction pooling mode. Conformance gate 10.3 (role leakage across pooled
# connections) is meaningless against a direct connection, so the pooler is part of
# the dev stack, not an ops detail bolted on later.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tenant_db
      TENANT_MIGRATE_PASSWORD: ${TENANT_MIGRATE_PASSWORD:-migrate_pw}
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:-app_pw}
    ports:
      - "55432:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      # Mounted separately: bootstrap/*.sql must NOT land in initdb.d, or the
      # entrypoint would run it directly without its :'migrate_pw' variables.
      - ./bootstrap:/bootstrap:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenant_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "56432:6432"
    volumes:
      - ./docker/pgbouncer:/etc/pgbouncer:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "59092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: inafin-tenant-data-dev1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  pgdata:
  miniodata:
