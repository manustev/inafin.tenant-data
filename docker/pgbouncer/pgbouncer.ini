;; Local dev PgBouncer.
;;
;; pool_mode = transaction is mandatory, not a tuning choice: the isolation model
;; relies on SET LOCAL ROLE dying at COMMIT. See ARCHITECTURE.md 5.2.
;;
;; NOTE on server_reset_query: PgBouncer IGNORES it in transaction mode unless
;; server_reset_query_always = 1. It is NOT what protects you here — the
;; transaction-local role is. It is set below as defence in depth only.

[databases]
tenant_db = host=postgres port=5432 dbname=tenant_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

;; default_pool_size = 1 in dev on purpose. Conformance gate 10.3 needs tenant A
;; and tenant B transactions to land on the SAME server connection; a larger pool
;; lets them drift onto separate backends and the test silently proves nothing.
default_pool_size = 1
max_client_conn = 200
min_pool_size = 0
reserve_pool_size = 0

server_reset_query = DISCARD ALL
server_reset_query_always = 1

ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
